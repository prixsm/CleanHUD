; CleanHUD - GTA San Andreas (1.0 US)
; Place this file beside CleanHUD.SA.asi. Restart the game after editing.
; 1 = enabled, 0 = disabled.

[Animation]
; When enabled, new elements above existing ones push them down on entry.
; New elements below the visible stack stay at their final location.
; No upward slide occurs while elements fade out. Default: off.
SlideStack=0
; Fade duration in milliseconds (0-2000).
FadeInMs=200
FadeOutMs=200

[Visibility]
; How long HUD elements remain after ordinary changes (0-60000 ms).
; Aiming/drive-by visibility uses the controls below, not this timer.
DurationMs=4000

[Elements]
; 0 returns that element to vanilla drawing/position and excludes it
; from CleanHUD's layout. Useful if another mod controls the element.
Clock=1
Money=1
Wanted=1
Weapon=1
Ammo=1
Armour=1
Breath=1
Health=1

[WeaponAmmo]
; Show Weapon/Ammo during on-foot aiming.
ShowOnFootAim=1
; Looking sideways only shows Weapon/Ammo when enabled.
; Drive-by firing always shows them (if usable ammo remains).
ShowOnVehicleLook=0

[Spacing]
; Position spacing in CleanHUD layout units. Decimals allowed.
; These values do not change the vanilla HUD of disabled elements.
MoneyToWantedSpacing=40.0
MoneyToWeaponSpacing=35.0
MoneyToStatusBarSpacing=28.0
WantedToWeaponSpacing=25.0
WantedToStatusBarSpacing=23.0
WeaponToStatusBarSpacingNoAmmo=10.0
ClockSpacing=40.0
WeaponSpacing=4.0
AmmoSpacing=4.0
ArmourSpacing=4.0
BreathSpacing=4.0
HealthSpacing=4.0
