; CleanHUD - GTA San Andreas (1.0 US)
; Place this file beside CleanHUD.SA.asi. Restart the game after editing.
; 1 = enabled, 0 = disabled.

[Animation]
; Slide neighboring HUD elements as items fade. Default: off.
SlideStack=0
; Fade duration in milliseconds (0-2000).
FadeInMs=200
FadeOutMs=200

[Visibility]
; How long HUD elements remain after ordinary changes (0-60000 ms).
; Aiming/drive-by visibility uses the controls below, not this timer.
DurationMs=4000

[Elements]
; 0 returns that element to vanilla drawing/position and excludes it
; from CleanHUD's layout. Useful if another mod controls the element.
Clock=1
Money=1
Wanted=1
Weapon=1
Ammo=1
Armour=1
Breath=1
Health=1

[WeaponAmmo]
; Show Weapon/Ammo during on-foot aiming.
ShowOnFootAim=1
; Look-left/right alone can reveal Weapon/Ammo in a vehicle.
; Set to 0 to require firing rather than just looking sideways.
ShowOnVehicleLook=1
; Reveal Weapon/Ammo when using a supported drive-by weapon.
ShowOnVehicleFire=1
; 1 keeps the ammo counter visible only while actively firing.
; TAB is still allowed to reveal the vanilla weapon HUD.
AmmoOnlyWhileFiring=0
