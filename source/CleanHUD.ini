; CleanHUD - GTA San Andreas 1.0 US
; Keep this file beside CleanHUD.SA.asi. Restart the game after editing.
; 1 = on, 0 = off. Missing options use their defaults.

[General]
; Stack: temporary HUD elements form a right-hand vertical stack.
; Minimal: temporary HUD elements fade at their original GTA positions.
HUDMode = Stack
; Clock always stays visible at the top (or at its original position in Minimal).
; If Clock=0 below, GTA draws the vanilla clock regardless of this setting.
AlwaysShowClock = 1

[Visibility]
; Milliseconds: fade-in/out 0-2000, duration 0-60000.
FadeInMs = 200
FadeOutMs = 200
DurationMs = 3000

[Animation]
; Optional entrance movement in Stack mode only (ignored in Minimal).
SlideStack = 0

[Elements]
; 1 = CleanHUD controls visibility; 0 = leave the element to vanilla/other mods.
; Clock=0 leaves the vanilla clock visible and reserves its space in Stack mode.
Clock = 1
Money = 1
Wanted = 1
Health = 1
Armour = 1
Breath = 1
Weapon = 1
Ammo = 1

[WeaponAmmo]
; Shooting and weapon/ammo changes still reveal the HUD as usual.
ShowOnFootAim = 1
; Allow aim-button reveal for grenade, tear gas, Molotov and satchel charge.
; Useful with mods that add aiming for thrown weapons. Off for vanilla GTA.
ShowOnThrowableAim = 0
; Looking left/right in a vehicle does not reveal Weapon/Ammo by default.
; Drive-by firing always can reveal them.
ShowOnVehicleLook = 0

; ADVANCED: optional layout tuning, only used with HUDMode=Stack.
; These numbers add extra vertical room between items. Decimals are allowed.
[Spacing]
; Gap after Clock depends on the first visible group beneath it.
; The same rule applies when Clock=0 reserves the vanilla clock's slot.
ClockToMoneySpacing = 25.0
ClockToWantedSpacing = 30.0
ClockToStatusBarSpacing = 20.0
ClockToWeaponSpacing = 27.5

MoneyToWantedSpacing = 35.0
MoneyToStatusBarSpacing = 25.0
MoneyToWeaponSpacing = 35.0

WantedToStatusBarSpacing = 25.0
WantedToWeaponSpacing = 35.0

StatusBarToWeaponSpacing = 10.0

WeaponSpacing = 4.0
AmmoSpacing = 4.0
ArmourSpacing = 4.0
BreathSpacing = 4.0
HealthSpacing = 4.0
