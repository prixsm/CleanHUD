; CleanHUD for GTA San Andreas (PC 1.0 US).
; Keep CleanHUD.ini next to CleanHUD.asi. Restart the game after manual edits.
; Change settings in-game with SleekConfig (optional).
; 1 = On, 0 = Off. You can leave the defaults as they are.

[General]
; Stack = HUD items line up on the right as needed.
; Minimal = the same fade effects, with GTA's original positions.
HUDMode = Stack
; Keep the clock visible. If Clock=0 below, GTA handles it instead.
AlwaysShowClock = 1

[Visibility]
; Time in milliseconds (1000 = 1 second).
FadeInMs = 200
FadeOutMs = 200
DurationMs = 3000

[Animation]
; Gently slide items into the stack (Stack mode only).
SlideStack = 0

[Elements]
; On = CleanHUD manages the item. Off = GTA or another HUD mod manages it.
; Clock=0 keeps GTA's clock and leaves room for it in Stack mode.
Clock = 1
Money = 1
Wanted = 1
Health = 1
Armour = 1
Breath = 1
Weapon = 1
Ammo = 1

[WeaponAmmo]
; Show weapon and ammo while aiming on foot.
ShowOnFootAim = 1
; Also show on aim with grenades and similar thrown weapons.
; Useful if another mod adds throwable aiming.
ShowOnThrowableAim = 0
; Also show when looking left/right in a vehicle.
; Actual drive-by shooting can reveal the HUD even when this is off.
ShowOnVehicleLook = 0

[SpecialIcons]
; Show cellphone, jetpack and custom weapon icons when available.
ShowHiddenWeaponIcons = 1
; Move the jetpack icon: positive X = right, positive Y = down.
JetpackIconOffsetX = 0.0
JetpackIconOffsetY = 0.0

[Skateboard]
; Optional support for skateboards used as vehicles (off by default).
; For Skate Mod Remake, use vehicle 12500 and icon model 12400.
; Your skateboard mod may use different IDs.
ShowWhileRiding = 0
VehicleModelId = 12500
IconModelId = 12400
; Move the riding icon: positive X = right, positive Y = down.
IconOffsetX = 0.0
IconOffsetY = 0.0

[Spacing]
; Advanced Layout: these settings only affect Stack mode.
; The defaults follow GTA's original HUD spacing and positions.
; Larger numbers add more space between HUD items.
; The first item below the clock/money/wanted stars sets which gap is used.
ClockToMoneySpacing = 25.0
ClockToWantedSpacing = 25.0
ClockToStatusBarSpacing = 22.0
ClockToWeaponSpacing = 30.0

MoneyToWantedSpacing = 25.0
MoneyToStatusBarSpacing = 22.0
MoneyToWeaponSpacing = 35.0

WantedToStatusBarSpacing = 22.0
WantedToWeaponSpacing = 32.0

StatusBarToWeaponSpacing = 17.0
ArmourSpacing = 4.0
BreathSpacing = 4.0

[WeaponAmmoLayout]
; Advanced Layout: only affects Stack mode; based on GTA's HUD positions.
; Move the weapon icon and ammo together.
; Positive X moves right; positive Y moves down.
WeaponAmmoOffsetX = 12.0
WeaponAmmoOffsetY = -16.0
; Gap below the weapon icon. Try 87.0 if using WidescreenFix's
; ProportionalWeaponIcon=1 option; otherwise keep 83.0.
WeaponToAmmoVerticalOffset = 83.0

; Hold a key or a mapped gamepad button to show GTA's usual HUD positions.
; Release it to return to CleanHUD. Default: Tab; gamepad off.
; Choose a keyboard key from the list below or in SleekConfig.
; Each number is a Windows virtual-key code (0 turns it off).
; KEYBOARD VK LIST:
; 0=Off | 8=Backspace | 9=Tab | 13=Enter
; 16=Shift | 17=Ctrl | 18=Alt | 19=Pause
; 20=Caps Lock | 27=Escape | 32=Space | 33=Page Up
; 34=Page Down | 35=End | 36=Home | 37=Left Arrow
; 38=Up Arrow | 39=Right Arrow | 40=Down Arrow | 45=Insert
; 46=Delete | 48=0 | 49=1 | 50=2
; 51=3 | 52=4 | 53=5 | 54=6
; 55=7 | 56=8 | 57=9 | 65=A
; 66=B | 67=C | 68=D | 69=E
; 70=F | 71=G | 72=H | 73=I
; 74=J | 75=K | 76=L | 77=M
; 78=N | 79=O | 80=P | 81=Q
; 82=R | 83=S | 84=T | 85=U
; 86=V | 87=W | 88=X | 89=Y
; 90=Z | 96=Numpad 0 | 97=Numpad 1 | 98=Numpad 2
; 99=Numpad 3 | 100=Numpad 4 | 101=Numpad 5 | 102=Numpad 6
; 103=Numpad 7 | 104=Numpad 8 | 105=Numpad 9 | 106=Numpad *
; 107=Numpad + | 109=Numpad - | 110=Numpad . | 111=Numpad /
; 112=F1 | 113=F2 | 114=F3 | 115=F4
; 116=F5 | 117=F6 | 118=F7 | 119=F8
; 120=F9 | 121=F10 | 122=F11 | 123=F12
; 144=Num Lock | 145=Scroll Lock | 160=Left Shift | 161=Right Shift
; 162=Left Ctrl | 163=Right Ctrl | 164=Left Alt | 165=Right Alt
; 186=Semicolon | 187=Plus/Equals | 188=Comma | 189=Minus
; 190=Period | 191=Slash | 192=Grave | 219=Left Bracket
; 220=Backslash | 221=Right Bracket | 222=Apostrophe
;
; Gamepad choices also follow GTA's keyboard mappings. For example,
; Ctrl may act like LB/L1. Choose Off if this causes unwanted previews.
; GAMEPAD BUTTON LIST (GTA CPad; Xbox / PlayStation equivalents):
; 0=Off | 1=LB/L1 | 2=LT/L2
; 3=RB/R1 | 4=RT/R2 | 5=D-pad Up
; 6=D-pad Down | 7=D-pad Left | 8=D-pad Right
; 9=Back/Select | 10=Start | 11=X/Square
; 12=Y/Triangle | 13=A/Cross | 14=B/Circle
; 15=Left stick click/L3 | 16=Right stick click/R3
; Your selected key or button still performs its usual in-game action.
[HUDPreview]
VanillaHUDKey = 9
VanillaHUDPadButton = 0
