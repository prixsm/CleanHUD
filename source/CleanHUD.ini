; CleanHUD - GTA San Andreas 1.0 US
; Keep this file beside CleanHUD.asi. Restart the game after editing.
; 1 = on, 0 = off. Missing options use their defaults.

[General]
; Stack: temporary HUD elements form a right-hand vertical stack.
; Minimal: temporary HUD elements fade at their original GTA positions.
HUDMode = Stack
; Clock always stays visible at the top (or at its original position in Minimal).
; If Clock=0 below, GTA draws the vanilla clock regardless of this setting.
AlwaysShowClock = 1

[Visibility]
; Milliseconds: fade-in/out 0-2000, duration 0-10000.
FadeInMs = 200
FadeOutMs = 200
DurationMs = 3000

[Animation]
; Optional entrance movement in Stack mode only (ignored in Minimal).
SlideStack = 0

[Elements]
; 1 = CleanHUD controls visibility; 0 = leave the element to vanilla/other mods.
; Clock=0 leaves the vanilla clock visible and reserves its space in Stack mode.
Clock = 1
Money = 1
Wanted = 1
Health = 1
Armour = 1
Breath = 1
Weapon = 1
Ammo = 1

[WeaponAmmo]
; Shooting and weapon/ammo changes still reveal the HUD as usual.
ShowOnFootAim = 1
; Allow aim-button reveal for grenade, tear gas, Molotov and satchel charge.
; Useful with mods that add aiming for thrown weapons. Off for vanilla GTA.
ShowOnThrowableAim = 0
; Looking left/right in a vehicle does not reveal Weapon/Ammo by default.
; Drive-by firing always can reveal them.
ShowOnVehicleLook = 0

; Optional hidden and custom equipment icons (on by default).
[SpecialIcons]
; One toggle for cellphone, jetpack and custom/unused weapon icons.
; Detect the currently held weapon model automatically.
ShowHiddenWeaponIcons = 1
; Jetpack replaces only fist/brass-knuckle icons.
; With any other held weapon (including throwable weapons), it
; appears to the left, using a built-in 12-unit right adjustment.
; X/Y offsets tune either position; positive X moves right,
; positive Y moves down.
JetpackIconOffsetX = 0.0
JetpackIconOffsetY = 0.0

; Optional skateboard-as-vehicle HUD icon (off by default).
; For the added (non-replacing) Skate Mod Remake setup:
; cleo/skate_remake.ini has VehicleID=12500, WeaponModel=12400,
; and WeaponType=70. The icon model is the WEAPON MODEL, not the
; custom vehicle model or the vanilla Cane model (326).
; If you previously saved IconModelId=326, change it manually to
; 12400; existing INI overrides are not replaced during upgrades.
; This detects a player *riding* the vehicle, not a Cane weapon or prop.
; The chosen icon model needs a model-name+"ICON" texture (native TXD
; or WeaponIconsTXD). Held skateboards use normal weapon icon handling.
; The riding icon uses CleanHUD's DurationMs/FadeInMs/FadeOutMs,
; and fades when the player dismounts.
[Skateboard]
ShowWhileRiding = 0
VehicleModelId = 12500
IconModelId = 12400
; Adjust its native-slot/left-side placement (virtual HUD units).
IconOffsetX = 0.0
IconOffsetY = 0.0

; ADVANCED: optional layout tuning, only used with HUDMode=Stack.
; Virtual layout-unit bounds: -1500.0 to 1500.0 (one decimal).
[Spacing]
; Gap after Clock depends on the first visible group beneath it.
; The same rule applies when Clock=0 reserves the vanilla clock's slot.
ClockToMoneySpacing = 25.0
ClockToWantedSpacing = 25.0
ClockToStatusBarSpacing = 22.0
ClockToWeaponSpacing = 30.0

MoneyToWantedSpacing = 25.0
MoneyToStatusBarSpacing = 22.0
MoneyToWeaponSpacing = 35.0

WantedToStatusBarSpacing = 22.0
WantedToWeaponSpacing = 32.0

StatusBarToWeaponSpacing = 17.0

ArmourSpacing = 4.0
BreathSpacing = 4.0

; ADVANCED: shared Weapon/Ammo group position in HUDMode=Stack.
; Positive X moves both right, positive Y moves both down.
; Same -1500.0..1500.0 virtual layout-unit bounds apply.
[WeaponAmmoLayout]
WeaponAmmoOffsetX = 12.0
WeaponAmmoOffsetY = -16.0
; Distance between Weapon icon and Ammo text along the stack.
; Set this to 87.0 if you have ProportionalWeaponIcon = 1 on your WidescreenFix.ini.
WeaponToAmmoVerticalOffset = 83.0
; HUD preview bindings (last so they are easy to find).
; Hold either input to show GTA's native HUD positions; release to resume CleanHUD.
; VanillaHUDKey is a Windows virtual-key (VK) code. All values 0..255
; are accepted; the common keyboard codes below are selectable in SleekConfig.
; Caution: the keyboard layout may change punctuation-key labels;
; avoid F10 when using SleekConfig, and avoid bindings already used by GTA.
; KEYBOARD VK LIST:
; 0=Off | 8=Backspace | 9=Tab | 13=Enter
; 16=Shift | 17=Ctrl | 18=Alt | 19=Pause
; 20=Caps Lock | 27=Escape | 32=Space | 33=Page Up
; 34=Page Down | 35=End | 36=Home | 37=Left Arrow
; 38=Up Arrow | 39=Right Arrow | 40=Down Arrow | 45=Insert
; 46=Delete | 48=0 | 49=1 | 50=2
; 51=3 | 52=4 | 53=5 | 54=6
; 55=7 | 56=8 | 57=9 | 65=A
; 66=B | 67=C | 68=D | 69=E
; 70=F | 71=G | 72=H | 73=I
; 74=J | 75=K | 76=L | 77=M
; 78=N | 79=O | 80=P | 81=Q
; 82=R | 83=S | 84=T | 85=U
; 86=V | 87=W | 88=X | 89=Y
; 90=Z | 96=Numpad 0 | 97=Numpad 1 | 98=Numpad 2
; 99=Numpad 3 | 100=Numpad 4 | 101=Numpad 5 | 102=Numpad 6
; 103=Numpad 7 | 104=Numpad 8 | 105=Numpad 9 | 106=Numpad *
; 107=Numpad + | 109=Numpad - | 110=Numpad . | 111=Numpad /
; 112=F1 | 113=F2 | 114=F3 | 115=F4
; 116=F5 | 117=F6 | 118=F7 | 119=F8
; 120=F9 | 121=F10 | 122=F11 | 123=F12
; 144=Num Lock | 145=Scroll Lock | 160=Left Shift | 161=Right Shift
; 162=Left Ctrl | 163=Right Ctrl | 164=Left Alt | 165=Right Alt
; 186=Semicolon | 187=Plus/Equals | 188=Comma | 189=Minus
; 190=Period | 191=Slash | 192=Grave | 219=Left Bracket
; 220=Backslash | 221=Right Bracket | 222=Apostrophe
;
; GAMEPAD BUTTON LIST (GTA CPad; Xbox / PlayStation equivalents):
; DEFAULT OFF: a CPad gamepad action can also respond to the keyboard
; key mapped to it (for example, Ctrl may activate LB/L1).
; Assign a gamepad value only if you are comfortable with that overlap.
; 0=Off | 1=LB/L1 | 2=LT/L2
; 3=RB/R1 | 4=RT/R2 | 5=D-pad Up
; 6=D-pad Down | 7=D-pad Left | 8=D-pad Right
; 9=Back/Select | 10=Start | 11=X/Square
; 12=Y/Triangle | 13=A/Cross | 14=B/Circle
; 15=Left stick click/L3 | 16=Right stick click/R3
; A control already used in-game will still perform its normal action.
[HUDPreview]
VanillaHUDKey = 9
VanillaHUDPadButton = 0
