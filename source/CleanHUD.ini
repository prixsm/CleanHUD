; CleanHUD - GTA San Andreas 1.0 US
; Keep this file beside CleanHUD.SA.asi. Restart the game after editing.
; 1 = on, 0 = off. Missing options use their defaults.

[General]
; Stack: temporary HUD elements form a right-hand vertical stack.
; Minimal: temporary HUD elements fade at their original GTA positions.
HUDMode = Stack
; Clock always stays visible at the top (or at its original position in Minimal).
; If Clock=0 below, GTA draws the vanilla clock regardless of this setting.
AlwaysShowClock = 1

[Visibility]
; Milliseconds: fade-in/out 0-2000, duration 0-10000.
FadeInMs = 200
FadeOutMs = 200
DurationMs = 3000

[Animation]
; Optional entrance movement in Stack mode only (ignored in Minimal).
SlideStack = 0

[Elements]
; 1 = CleanHUD controls visibility; 0 = leave the element to vanilla/other mods.
; Clock=0 leaves the vanilla clock visible and reserves its space in Stack mode.
Clock = 1
Money = 1
Wanted = 1
Health = 1
Armour = 1
Breath = 1
Weapon = 1
Ammo = 1

[WeaponAmmo]
; Shooting and weapon/ammo changes still reveal the HUD as usual.
ShowOnFootAim = 1
; Allow aim-button reveal for grenade, tear gas, Molotov and satchel charge.
; Useful with mods that add aiming for thrown weapons. Off for vanilla GTA.
ShowOnThrowableAim = 0
; Looking left/right in a vehicle does not reveal Weapon/Ammo by default.
; Drive-by firing always can reveal them.
ShowOnVehicleLook = 0

; Optional hidden and custom equipment icons (off by default).
[SpecialIcons]
; One toggle for cellphone, jetpack and custom/unused weapon icons.
; Detect the currently held weapon model automatically.
ShowHiddenWeaponIcons = 0
; When holding a gun with a jetpack, show its icon to the left.
; Without this, jetpack replaces the fist icon only if unarmed.
ShowJetpackBesideWeapon = 0

; ADVANCED: optional layout tuning, only used with HUDMode=Stack.
; Virtual layout-unit bounds: -16384.00 to 16384.00 (two decimals).
[Spacing]
; Gap after Clock depends on the first visible group beneath it.
; The same rule applies when Clock=0 reserves the vanilla clock's slot.
ClockToMoneySpacing = 25.0
ClockToWantedSpacing = 25.0
ClockToStatusBarSpacing = 22.5
ClockToWeaponSpacing = 30.0

MoneyToWantedSpacing = 25.0
MoneyToStatusBarSpacing = 22.5
MoneyToWeaponSpacing = 35.0

WantedToStatusBarSpacing = 22.5
WantedToWeaponSpacing = 32.5

StatusBarToWeaponSpacing = 17.5

ArmourSpacing = 4.0
BreathSpacing = 4.0

; ADVANCED: shared Weapon/Ammo group position in HUDMode=Stack.
; Positive X moves both right, positive Y moves both down.
; Same -16384.00..16384.00 virtual layout-unit bounds apply.
[WeaponAmmoLayout]
WeaponAmmoOffsetX = 12.00
WeaponAmmoOffsetY = -16.00
; Distance between Weapon icon and Ammo text along the stack.
WeaponToAmmoVerticalOffset = 87.00