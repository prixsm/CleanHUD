# ==== 𝗖𝗹𝗲𝗮𝗻𝗛𝗨𝗗 v1.0.0 ========================================= 𝗽𝗿𝗶𝘅𝘀𝗺.𝗺𝗮𝗱𝗲 Δ
; Keep CleanHUD.ini next to CleanHUD.asi. Restart the game after manual edits.
; If you want to change settings and preview in real-time, use SleekConfig!
; https://libertycity.net/files/gta-san-andreas/244634-sleekconfig.html

[General]
; Stack = HUD items line up on the right as needed.
; Minimal = the same fade effects, with their original positions.
HUDMode = Stack

; Keep the clock visible on Stack. If Clock = 0 on [Elements] below, the game handles it instead.
AlwaysShowClock = 1

[Visibility]
; How long will the items fade in/out, and stay visible in milliseconds (1000 = 1 sec)
FadeInMs = 200
FadeOutMs = 200
DurationMs = 3000

[Animation]
; Gently slide items into the stack (Stack mode only).
SlideStack = 0

[Elements]
; Setting to 1 lets CleanHUD manage the item, 0 lets the game/other HUD mod manage it.
; Clock = 0 keeps GTA's clock and leaves room for it in Stack mode.
Clock = 1
Money = 1
Wanted = 1
Health = 1
Armour = 1
Breath = 1
Weapon = 1
Ammo = 1

[WeaponAmmo]
; Show weapon and ammo while aiming on foot.
ShowOnFootAim = 1

; Also show on aim with grenades and similar thrown weapons.
; Useful if another mod adds throwable aiming.
ShowOnThrowableAim = 0

; Also show when looking left/right in a vehicle.
; Actual drive-by shooting can reveal the HUD even when this is off.
ShowOnVehicleLook = 0

[SpecialIcons]
; Show cellphone, jetpack and custom weapon icons when available.
ShowHiddenWeaponIcons = 1

; Positive X moves right; positive Y moves down.
JetpackIconOffsetX = 0.0
JetpackIconOffsetY = 0.0

[Skateboard]
; Optional support for skateboards used as vehicles.
; For Skate Mod Remake, the defaults are vehicle 12500 and icon model 12400.
; Other skateboard mods may use different IDs.
ShowWhileRiding = 0
VehicleModelId = 12500
IconModelId = 12400

; Positive X moves right; positive Y moves down.
IconOffsetX = 0.0
IconOffsetY = 0.0

[Spacing]
; These only affect Stack mode.
; The defaults follow the game's original HUD spacing and positions.
ClockToMoneySpacing = 22.0
ClockToWantedSpacing = 25.0
ClockToStatusBarSpacing = 19.0
ClockToWeaponSpacing = 30.0

MoneyToWantedSpacing = 25.0
MoneyToStatusBarSpacing = 21.0
MoneyToWeaponSpacing = 35.0

WantedToStatusBarSpacing = 22.0
WantedToWeaponSpacing = 32.0

StatusBarToWeaponSpacing = 18.0
ArmourSpacing = 4.0
BreathSpacing = 4.0

[WeaponAmmoLayout]
; These only affect Stack mode.
; The defaults follow the game's original HUD positions.

; Move the weapon icon and ammo together.
; Positive X moves right; positive Y moves down.
WeaponAmmoOffsetX = 12.0
WeaponAmmoOffsetY = -16.0

; Gap below the weapon icon.
; Set this to 87.0 if you have ProportionalWeaponIcon = 1 on WidescreenFix.ini.
WeaponToAmmoVerticalOffset = 83.0

[HUDPreview]
; Hold a key or a mapped gamepad button to show the main HUD positions.
; Release it to return to CleanHUD.

; Gamepad choices also follow the game's keyboard mappings. For example,
; Ctrl may act like LB/L1. Choose Off if this causes unwanted previews.
; The selected key/button still performs its usual in-game action.

VanillaHUDKey = 9
VanillaHUDPadButton = 0

