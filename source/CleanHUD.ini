; CleanHUD
; Place this file beside CleanHUD.SA.asi. Restart after editing.
; 1 = enabled, 0 = disabled.

[Animation]
; Sliding is optional and off by default.
SlideStack = 0
FadeInMs = 200
FadeOutMs = 200

[Visibility]
DurationMs = 3000

[Elements]
; 0 restores vanilla behavior for the selected element.
Clock = 1
; Clock=0 keeps the vanilla clock visible and reserves its slot.
Money = 1
Wanted = 1
Weapon = 1
Ammo = 1
Armour = 1
Breath = 1
Health = 1

[WeaponAmmo]
ShowOnFootAim = 1

; Side-looking alone does not reveal weapons.
ShowOnVehicleLook = 0

[Spacing]
MoneyToWantedSpacing = 35.0
MoneyToWeaponSpacing = 35.0
MoneyToStatusBarSpacing = 25.0

WantedToWeaponSpacing = 35.0
WantedToStatusBarSpacing = 25.0
WeaponToStatusBarSpacingNoAmmo = 10.0

; Clock gap also reserves room beneath vanilla clock when Clock=0.
ClockSpacing = 40.0
WeaponSpacing = 4.0
AmmoSpacing = 4.0
ArmourSpacing = 4.0
BreathSpacing = 4.0
HealthSpacing = 4.0
